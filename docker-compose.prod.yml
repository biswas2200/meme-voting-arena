# =============================================================
# docker-compose.prod.yml — PRODUCTION REFERENCE
#
# Runs both containers with the 'prod' Spring profile and a
# production-style frontend build, against an external Postgres
# instance (not a local container) — for smoke-testing the
# production images and documenting the expected env vars before
# deploying them wherever you host the app.
#
# Usage (local smoke test only):
#   cp .env.prod.example .env.prod
#   # Fill in real values in .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build
#
# NEVER commit .env.prod — it contains real secrets.
# =============================================================

services:

  # ── Spring Boot Backend ─────────────────────────────────────
  # DATABASE_URL points to an external Postgres instance, not a local container.
  backend:
    build:
      context: ./gdg
      dockerfile: Dockerfile
    image: meme-arena-backend:${IMAGE_TAG:-latest}
    container_name: meme_arena_backend_prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      # Meme images are stored on local disk — persist them across
      # container restarts/redeploys. Mount this to durable storage
      # on whatever host actually runs this in production.
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── React Frontend ───────────────────────────────────────────
  # This service is here only for local smoke-testing the prod image.
  frontend:
    build:
      context: ./meme-arena-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    image: meme-arena-frontend:${IMAGE_TAG:-latest}
    container_name: meme_arena_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  uploads_data:
