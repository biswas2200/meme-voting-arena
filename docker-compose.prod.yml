# =============================================================
# docker-compose.prod.yml — PRODUCTION REFERENCE
#
# This file is a reference for how the containers are configured
# in production. On AWS you will NOT run docker-compose directly —
# instead use ECS task definitions or ECR + ECS Fargate.
#
# This file is useful for:
#   1. Smoke-testing the production image locally before pushing
#   2. Documenting the expected env vars for ECS task definitions
#
# Usage (local smoke test only):
#   cp .env.prod.example .env.prod
#   # Fill in real values in .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build
#
# NEVER commit .env.prod — it contains real secrets.
# =============================================================

services:

  # ── Spring Boot Backend ─────────────────────────────────────
  # In production this runs on ECS Fargate.
  # DATABASE_URL points to AWS RDS, not a local container.
  backend:
    build:
      context: ./gdg
      dockerfile: Dockerfile
    image: meme-arena-backend:${IMAGE_TAG:-latest}
    container_name: meme_arena_backend_prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── React Frontend ───────────────────────────────────────────
  # In production this is a static build deployed to S3 + CloudFront.
  # This service is here only for local smoke-testing the prod image.
  frontend:
    build:
      context: ./meme-arena-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    image: meme-arena-frontend:${IMAGE_TAG:-latest}
    container_name: meme_arena_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
