name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: meme-arena-backend
  ECS_CLUSTER: meme-cluster
  ECS_SERVICE: meme-arena-service
  TASK_DEFINITION: meme-arena-backend
  S3_BUCKET: meme-arena-frontend-562273658670
  CLOUDFRONT_ID: E331210BH0NF20
  TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:ap-south-1:562273658670:targetgroup/meme-arena-tg/02fea216f1f11ac5

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          cd gdg
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B

      - name: Copy JAR for Docker
        run: cp gdg/target/*.jar gdg/app.jar

      - name: Build & push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f gdg/Dockerfile.prebuilt -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest gdg/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Deploying image: $NEW_IMAGE"

          # Get current task definition, strip read-only fields, update image
          aws ecs describe-task-definition \
            --task-definition $TASK_DEFINITION \
            --region $AWS_REGION \
            --query "taskDefinition" \
            --output json > /tmp/current-task-def.json

          # Use jq to update the image and strip read-only fields
          jq --arg IMAGE "$NEW_IMAGE" '
            .containerDefinitions |= map(if .name == "backend" then .image = $IMAGE else . end) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' /tmp/current-task-def.json > /tmp/new-task-def.json

          # Register new task definition revision
          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-task-def.json \
            --region $AWS_REGION \
            --query "taskDefinition.revision" \
            --output text)
          echo "Registered task definition revision: $NEW_REVISION"

          # Update service with new revision + keep load balancer attached
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $TASK_DEFINITION:$NEW_REVISION \
            --force-new-deployment \
            --load-balancers "targetGroupArn=$TARGET_GROUP_ARN,containerName=backend,containerPort=8080" \
            --region $AWS_REGION
          echo "ECS service updated to revision $NEW_REVISION"

      - name: Wait for new ECS task to start
        run: |
          echo "Waiting 90 seconds for new task to start..."
          sleep 90

      - name: Re-register new task IP with ALB target group
        run: |
          TG_ARN=$TARGET_GROUP_ARN

          # Get all running task IPs for this service
          TASK_ARNS=$(aws ecs list-tasks \
            --cluster $ECS_CLUSTER \
            --service-name $ECS_SERVICE \
            --region $AWS_REGION \
            --query "taskArns" --output text)
          echo "Running tasks: $TASK_ARNS"

          # Collect all current task IPs
          NEW_IPS=()
          for TASK_ARN in $TASK_ARNS; do
            IP=$(aws ecs describe-tasks \
              --cluster $ECS_CLUSTER \
              --tasks $TASK_ARN \
              --region $AWS_REGION \
              --query "tasks[0].attachments[0].details[?name=='privateIPv4Address'].value|[0]" \
              --output text)
            echo "Task $TASK_ARN -> IP: $IP"
            NEW_IPS+=($IP)
          done

          # Deregister all old targets not in the current task list
          OLD_TARGETS=$(aws elbv2 describe-target-health \
            --target-group-arn $TG_ARN \
            --region $AWS_REGION \
            --query "TargetHealthDescriptions[*].Target.Id" \
            --output text)

          for OLD_IP in $OLD_TARGETS; do
            FOUND=false
            for NEW_IP in "${NEW_IPS[@]}"; do
              if [ "$OLD_IP" = "$NEW_IP" ]; then FOUND=true; break; fi
            done
            if [ "$FOUND" = "false" ] && [ -n "$OLD_IP" ]; then
              echo "Deregistering stale IP: $OLD_IP"
              aws elbv2 deregister-targets \
                --target-group-arn $TG_ARN \
                --targets "Id=$OLD_IP,Port=8080" \
                --region $AWS_REGION
            fi
          done

          # Register all current task IPs
          for NEW_IP in "${NEW_IPS[@]}"; do
            echo "Registering: $NEW_IP"
            aws elbv2 register-targets \
              --target-group-arn $TG_ARN \
              --targets "Id=$NEW_IP,Port=8080" \
              --region $AWS_REGION
          done

          # Poll for healthy status (max 5 minutes, no hard AWS wait limit)
          echo "Polling for healthy target (max 5 min)..."
          for i in $(seq 1 20); do
            HEALTHY=$(aws elbv2 describe-target-health \
              --target-group-arn $TG_ARN \
              --region $AWS_REGION \
              --query "TargetHealthDescriptions[?TargetHealth.State=='healthy'].Target.Id" \
              --output text)
            if [ -n "$HEALTHY" ]; then
              echo "Healthy target(s): $HEALTHY"
              echo "Deployment complete!"
              exit 0
            fi
            echo "Attempt $i/20 — no healthy target yet, waiting 15s..."
            sleep 15
          done
          echo "WARNING: No healthy target after 5 minutes. Check ECS logs."
          exit 1

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: meme-arena-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd meme-arena-frontend
          npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://d1i3pilqzxap5e.cloudfront.net
        run: |
          cd meme-arena-frontend
          npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync meme-arena-frontend/build/ s3://$S3_BUCKET --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_ID \
            --paths "/*"
