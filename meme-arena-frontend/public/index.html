<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00ccff" />
    <meta
      name="description"
      content="Meme Voting Arena - Battle your memes in the ultimate futuristic arena"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Futuristic Tron Blue Theme Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Meme Voting Arena</title>
    
    <style>
      /* Tron Loading Animation */
      .tron-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #000814 0%, #001d3d 50%, #003566 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .tron-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader-grid {
        width: 120px;
        height: 120px;
        position: relative;
      }
      
      .loader-grid::before,
      .loader-grid::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid transparent;
        border-radius: 50%;
        animation: tronSpin 2s linear infinite;
      }
      
      .loader-grid::before {
        border-top-color: #00ccff;
        border-right-color: #0099cc;
        animation-delay: 0s;
      }
      
      .loader-grid::after {
        border-bottom-color: #00ffff;
        border-left-color: #0066cc;
        animation-delay: 1s;
      }
      
      @keyframes tronSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loader-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #00ccff;
        font-family: 'Orbitron', monospace;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        animation: glow 2s ease-in-out infinite alternate;
      }
      
      @keyframes glow {
        from {
          text-shadow: 0 0 10px #00ccff, 0 0 20px #00ccff, 0 0 30px #00ccff;
        }
        to {
          text-shadow: 0 0 20px #00ccff, 0 0 30px #00ccff, 0 0 40px #00ccff;
        }
      }
      
      /* Hide loader when React app loads */
      body.app-loaded .tron-loader {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Tron Loading Screen -->
    <div class="tron-loader" id="tronLoader">
      <div class="loader-grid">
        <div class="loader-text">Loading Arena</div>
      </div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide loader when React app is ready — max 3 seconds regardless
      function hideLoader() {
        const loader = document.getElementById('tronLoader');
        if (loader) {
          loader.classList.add('fade-out');
          setTimeout(() => { loader.remove(); }, 500);
        }
      }
      window.addEventListener('load', () => {
        setTimeout(hideLoader, 800);
      });
      // Safety net: always remove after 3 seconds even if load event is slow
      setTimeout(hideLoader, 3000);
    </script>
  </body>
</html>
