# ============================================================
# Test Profile — H2 In-Memory Database
# ============================================================

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:meme_arena_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# CORS
app.cors.allowed-origins=*

# JWT
app.jwt.secret=test_secret_key_for_integration_tests_only_not_for_production
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.meme.gdg=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
