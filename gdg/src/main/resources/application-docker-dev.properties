# =============================================================
# docker-dev Profile — PostgreSQL inside Docker Compose
#
# Used when running: docker compose up
# The DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD env vars
# are injected by docker-compose.yml pointing to the 'db' service.
# =============================================================

# PostgreSQL (injected by docker-compose)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP (light settings for local dev)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# CORS — React dev server
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:-86400000}

# Logging
logging.level.com.meme.gdg=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
