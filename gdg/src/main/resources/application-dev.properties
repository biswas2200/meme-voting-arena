# ============================================================
# Development Profile — H2 In-Memory Database
# Run with: mvn spring-boot:run  (default profile is 'dev')
# ============================================================

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:meme_arena_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# JWT (dev only — safe placeholder, not a real secret)
app.jwt.secret=dev_only_not_for_production_replace_via_JWT_SECRET_env_var
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.meme.gdg=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# File upload size limits
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
