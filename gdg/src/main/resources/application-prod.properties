# ============================================================
# Production Profile — PostgreSQL
# All sensitive values MUST be supplied via environment variables.
# Never commit real credentials to source control.
# ============================================================

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool (tuned for a small-instance managed Postgres)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# CORS — set to your frontend's deployed URL
app.cors.allowed-origins=${CORS_ORIGINS}

# JWT — must be a strong 256-bit secret
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging — keep it lean in production
logging.level.com.meme.gdg=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Disable H2 console in production
spring.h2.console.enabled=false

# File upload size limits
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Actuator — only expose health endpoint in prod
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
