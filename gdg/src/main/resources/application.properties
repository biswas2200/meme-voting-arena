spring.application.name=memeVotingArena

# Active Profile
# Use 'dev' for local development (H2), 'prod' for AWS deployment (RDS PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT Configuration - 24 hours expiration (86400000ms)
# IMPORTANT: Always set JWT_SECRET env var in production. The fallback below is for
# local dev only and must NEVER be used in any deployed environment.
app.jwt.secret=${JWT_SECRET:local_dev_only_set_JWT_SECRET_env_var_for_any_real_deployment}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Server Configuration
server.port=${PORT:8080}

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Actuator (health checks for AWS ALB / ECS)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
